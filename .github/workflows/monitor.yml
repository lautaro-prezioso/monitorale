name: Monitor ofertas ALE

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # para probarlo a mano

permissions:
  contents: write

concurrency:
  group: monitor-ale
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la página
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Guardar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.txt
          git diff --cached --quiet || (git commit -m "actualizar estado" && git pull --rebase origin main && git push)
