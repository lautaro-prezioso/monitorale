name: Monitor ofertas ALE

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos, en minutos menos saturados
  workflow_dispatch:          # para probarlo a mano

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la página
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py

      - name: Guardar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.txt
          git diff --cached --quiet || (git commit -m "actualizar estado" && git pull --rebase origin main && git push)

      - name: Commit de actividad (si pasaron 30 días)
        run: |
          ultimo=$(git log -1 --format=%ct)
          ahora=$(date +%s)
          if [ $((ahora - ultimo)) -gt 2592000 ]; then
            git commit --allow-empty -m "mantener repositorio activo"
            git pull --rebase origin main && git push
          fi

      - name: Mantener el workflow activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable monitor.yml --repo ${{ github.repository }}
